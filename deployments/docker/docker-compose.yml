version: '3.8'

# SIMPLIFIED ARCHITECTURE: No Manager Needed!
# GlusterFS nodes are peer-to-peer and self-managing
# Management commands: docker exec gluster-cluster-node1 gluster <command>

services:
  # GlusterFS Node 1 - Equal peer with management capabilities
  gluster-node1:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 192.168.100.10
    volumes:
      - gluster-cluster-node1-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
      - NODE_IP=192.168.100.10
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE1_PORT:-25007}:24007"
      - "${GLUSTER_NODE1_BRICK_PORT:-50152}:49152"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "glusterd"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GlusterFS Node 2 - Equal peer with management capabilities  
  gluster-node2:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 192.168.100.11
    volumes:
      - gluster-cluster-node2-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
      - NODE_IP=192.168.100.11
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE2_PORT:-25008}:24007"
      - "${GLUSTER_NODE2_BRICK_PORT:-50153}:49152"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "glusterd"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GlusterFS Node 3 - Equal peer with management capabilities
  gluster-node3:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 192.168.100.12
    volumes:
      - gluster-cluster-node3-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
      - NODE_IP=192.168.100.12
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE3_PORT:-25009}:24007"
      - "${GLUSTER_NODE3_BRICK_PORT:-50154}:49152"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "glusterd"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GlusterFS Client - Mounts the shared volume
  gluster-client:
    image: ${GLUSTER_CLIENT_IMAGE:-gluster-cluster/client:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-client
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-client
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-client
    privileged: true
    networks:
      - gluster-net
    volumes:
      - shared-storage:/mnt/shared
    environment:
      - GLUSTER_CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_SERVER=gluster-cluster-node1
      - GLUSTER_VOLUME=${GLUSTER_VOLUME_NAME:-shared}
      - MOUNT_POINT=/mnt/shared
      - RETRY_COUNT=30
      - RETRY_DELAY=5
    depends_on:
      - gluster-node1
      - gluster-node2
      - gluster-node3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mount", "|", "grep", "glusterfs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Example application - Tomcat using the shared volume
  tomcat-app:
    image: tomcat:9-jre11
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-tomcat-app
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-tomcat-app
    networks:
      - gluster-net
    volumes:
      - shared-storage:/opt/tomcat/webapps/zenoptics/resources:rw
    ports:
      - "${TOMCAT_PORT:-8080}:8080"
    depends_on:
      - gluster-client
    restart: unless-stopped

# Network configuration
networks:
  gluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

# Volume definitions  
volumes:
  gluster-cluster-node1-data:
    driver: local
  gluster-cluster-node2-data:
    driver: local
  gluster-cluster-node3-data:
    driver: local
  shared-storage:
    driver: local

# Management Commands (run from any node):
# Setup cluster: docker exec gluster-cluster-node1 gluster peer probe gluster-cluster-node2
# Create volume: docker exec gluster-cluster-node1 gluster volume create shared replica 3 node1:/data/glusterfs/shared node2:/data/glusterfs/shared node3:/data/glusterfs/shared force
# Start volume: docker exec gluster-cluster-node1 gluster volume start shared
# Check status: docker exec gluster-cluster-node1 gluster volume status shared