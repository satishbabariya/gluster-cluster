version: '3.8'

services:
  # GlusterFS Manager
  gluster-manager:
    image: ${GLUSTER_MANAGER_IMAGE:-gluster-cluster/manager:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-manager
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-manager
    networks:
      - gluster-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    environment:
      - GLUSTER_CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_NODE_IPS=${GLUSTER_NODE_IPS:-172.20.0.10,172.20.0.11,172.20.0.12}
      - GLUSTER_REPLICA_COUNT=${GLUSTER_REPLICA_COUNT:-3}
      - GLUSTER_NETWORK_SUBNET=${GLUSTER_NETWORK_SUBNET:-172.20.0.0/16}
      - GLUSTER_NETWORK_NAME=${GLUSTER_NETWORK_NAME:-gluster-net}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_VOLUMES=${GLUSTER_VOLUMES:-shared:replicated:3:/mnt/shared/tomcat-resources,/mnt/shared/app-data:/mnt/shared}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    depends_on:
      - gluster-node1
      - gluster-node2
      - gluster-node3
    restart: unless-stopped

  # GlusterFS Nodes
  gluster-node1:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.10
    volumes:
      - ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
      - NODE_IP=172.20.0.10
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE1_PORT:-24007}:24007"
      - "${GLUSTER_NODE1_BRICK_PORT:-49152}:49152"
    restart: unless-stopped

  gluster-node2:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.11
    volumes:
      - ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2
      - NODE_IP=172.20.0.11
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE2_PORT:-24008}:24007"
      - "${GLUSTER_NODE2_BRICK_PORT:-49153}:49152"
    restart: unless-stopped

  gluster-node3:
    image: ${GLUSTER_NODE_IMAGE:-gluster-cluster/node:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-node
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.12
    volumes:
      - ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3-data:${GLUSTER_DATA_PATH:-/data/glusterfs}
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3
      - NODE_IP=172.20.0.12
      - CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_DATA_PATH=${GLUSTER_DATA_PATH:-/data/glusterfs}
      - GLUSTER_LOG_LEVEL=${GLUSTER_LOG_LEVEL:-info}
    ports:
      - "${GLUSTER_NODE3_PORT:-24009}:24007"
      - "${GLUSTER_NODE3_BRICK_PORT:-49154}:49152"
    restart: unless-stopped

  # Example Application using GlusterFS
  tomcat-app:
    image: tomcat:9-jre11
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-tomcat-app
    depends_on:
      - gluster-manager
    networks:
      - gluster-net
    ports:
      - "${TOMCAT_PORT:-8080}:8080"
    volumes:
      - gluster-shared-volume:/opt/tomcat/webapps/zenoptics/resources:rw
    environment:
      - CATALINA_OPTS=-Xmx512m
    restart: unless-stopped

  # GlusterFS Client for mounting volumes
  gluster-client:
    image: ${GLUSTER_CLIENT_IMAGE:-gluster-cluster/client:latest}
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.gluster-client
    hostname: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-client
    container_name: ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-client
    privileged: true
    depends_on:
      - gluster-manager
    networks:
      - gluster-net
    volumes:
      - gluster-shared-volume:/mnt/shared:rw
    environment:
      - GLUSTER_CLUSTER_NAME=${GLUSTER_CLUSTER_NAME:-gluster-cluster}
      - GLUSTER_SERVER=${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1
      - GLUSTER_VOLUME=shared
      - MOUNT_POINT=/mnt/shared
    restart: unless-stopped

networks:
  gluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${GLUSTER_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node1-data:
    driver: local
  ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node2-data:
    driver: local
  ${GLUSTER_CLUSTER_NAME:-gluster-cluster}-node3-data:
    driver: local
  gluster-shared-volume:
    driver: local