# Simple GlusterFS Deployment Example
# This creates a 3-node GlusterFS cluster with a shared volume

version: '3.8'

services:
  gluster-manager:
    image: gluster-cluster/manager:latest
    container_name: gluster-manager
    networks:
      - gluster-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GLUSTER_CLUSTER_NAME=simple-cluster
      - GLUSTER_NODE_IPS=172.20.0.10,172.20.0.11,172.20.0.12
      - GLUSTER_REPLICA_COUNT=3
      - GLUSTER_VOLUMES=shared:replicated:3:/mnt/shared:/mnt/shared
      - GLUSTER_LOG_LEVEL=info
    depends_on:
      - gluster-node1
      - gluster-node2
      - gluster-node3

  gluster-node1:
    image: gluster-cluster/node:latest
    hostname: simple-cluster-node1
    container_name: simple-cluster-node1
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.10
    volumes:
      - simple-cluster-node1-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=simple-cluster-node1
      - NODE_IP=172.20.0.10
      - CLUSTER_NAME=simple-cluster
    ports:
      - "24007:24007"
      - "49152:49152"

  gluster-node2:
    image: gluster-cluster/node:latest
    hostname: simple-cluster-node2
    container_name: simple-cluster-node2
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.11
    volumes:
      - simple-cluster-node2-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=simple-cluster-node2
      - NODE_IP=172.20.0.11
      - CLUSTER_NAME=simple-cluster
    ports:
      - "24008:24007"
      - "49153:49152"

  gluster-node3:
    image: gluster-cluster/node:latest
    hostname: simple-cluster-node3
    container_name: simple-cluster-node3
    privileged: true
    networks:
      gluster-net:
        ipv4_address: 172.20.0.12
    volumes:
      - simple-cluster-node3-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=simple-cluster-node3
      - NODE_IP=172.20.0.12
      - CLUSTER_NAME=simple-cluster
    ports:
      - "24009:24007"
      - "49154:49152"

  # Your application that uses the shared storage
  my-app:
    image: your-app:latest
    container_name: my-app
    depends_on:
      - gluster-manager
    networks:
      - gluster-net
    volumes:
      - shared-storage:/mnt/shared:rw
    environment:
      - SHARED_DATA_PATH=/mnt/shared

  # Client to mount the GlusterFS volume
  gluster-client:
    image: gluster-cluster/client:latest
    hostname: simple-cluster-client
    container_name: simple-cluster-client
    privileged: true
    depends_on:
      - gluster-manager
    networks:
      - gluster-net
    volumes:
      - shared-storage:/mnt/shared:rw
    environment:
      - GLUSTER_SERVER=simple-cluster-node1
      - GLUSTER_VOLUME=shared
      - MOUNT_POINT=/mnt/shared

networks:
  gluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  simple-cluster-node1-data:
  simple-cluster-node2-data:
  simple-cluster-node3-data:
  shared-storage: