# Example: Tomcat with GlusterFS Shared Resources
# This example shows how to use GlusterFS for sharing Tomcat resources across nodes

version: '3.8'

services:
  # GlusterFS Manager
  gluster-manager:
    image: gluster-cluster/manager:latest
    container_name: tomcat-gluster-manager
    networks:
      - app-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GLUSTER_CLUSTER_NAME=tomcat-cluster
      - GLUSTER_NODE_IPS=172.20.0.10,172.20.0.11,172.20.0.12
      - GLUSTER_REPLICA_COUNT=3
      - GLUSTER_VOLUMES=resources:replicated:3:/mnt/shared/tomcat-resources:/opt/tomcat/webapps/zenoptics/resources
      - GLUSTER_LOG_LEVEL=info
    depends_on:
      - gluster-node1
      - gluster-node2
      - gluster-node3
    restart: unless-stopped

  # GlusterFS Nodes
  gluster-node1:
    image: gluster-cluster/node:latest
    hostname: tomcat-cluster-node1
    container_name: tomcat-cluster-node1
    privileged: true
    networks:
      app-net:
        ipv4_address: 172.20.0.10
    volumes:
      - tomcat-cluster-node1-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=tomcat-cluster-node1
      - NODE_IP=172.20.0.10
      - CLUSTER_NAME=tomcat-cluster
    ports:
      - "24007:24007"
      - "49152:49152"
    restart: unless-stopped

  gluster-node2:
    image: gluster-cluster/node:latest
    hostname: tomcat-cluster-node2
    container_name: tomcat-cluster-node2
    privileged: true
    networks:
      app-net:
        ipv4_address: 172.20.0.11
    volumes:
      - tomcat-cluster-node2-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=tomcat-cluster-node2
      - NODE_IP=172.20.0.11
      - CLUSTER_NAME=tomcat-cluster
    ports:
      - "24008:24007"
      - "49153:49152"
    restart: unless-stopped

  gluster-node3:
    image: gluster-cluster/node:latest
    hostname: tomcat-cluster-node3
    container_name: tomcat-cluster-node3
    privileged: true
    networks:
      app-net:
        ipv4_address: 172.20.0.12
    volumes:
      - tomcat-cluster-node3-data:/data/glusterfs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      - NODE_NAME=tomcat-cluster-node3
      - NODE_IP=172.20.0.12
      - CLUSTER_NAME=tomcat-cluster
    ports:
      - "24009:24007"
      - "49154:49152"
    restart: unless-stopped

  # GlusterFS Client for mounting volumes
  gluster-client:
    image: gluster-cluster/client:latest
    hostname: tomcat-cluster-client
    container_name: tomcat-cluster-client
    privileged: true
    depends_on:
      - gluster-manager
    networks:
      - app-net
    volumes:
      - shared-resources:/mnt/shared:rw
    environment:
      - GLUSTER_SERVER=tomcat-cluster-node1
      - GLUSTER_VOLUME=resources
      - MOUNT_POINT=/mnt/shared
    restart: unless-stopped

  # Tomcat Application 1 (simulating multi-node deployment)
  tomcat-app1:
    image: tomcat:9-jre11
    container_name: tomcat-app1
    depends_on:
      - gluster-client
    networks:
      - app-net
    ports:
      - "8080:8080"
    volumes:
      # This is the key: shared resources across all Tomcat instances
      - shared-resources:/opt/tomcat/webapps/zenoptics/resources:rw
    environment:
      - CATALINA_OPTS=-Xmx512m -Djava.security.egd=file:/dev/./urandom
      - JAVA_OPTS=-Dspring.profiles.active=production
    restart: unless-stopped

  # Tomcat Application 2 (simulating another node)
  tomcat-app2:
    image: tomcat:9-jre11
    container_name: tomcat-app2
    depends_on:
      - gluster-client
    networks:
      - app-net
    ports:
      - "8081:8080"
    volumes:
      # Same shared volume - automatically synchronized
      - shared-resources:/opt/tomcat/webapps/zenoptics/resources:rw
    environment:
      - CATALINA_OPTS=-Xmx512m -Djava.security.egd=file:/dev/./urandom
      - JAVA_OPTS=-Dspring.profiles.active=production
    restart: unless-stopped

  # Tomcat Application 3 (simulating third node)
  tomcat-app3:
    image: tomcat:9-jre11
    container_name: tomcat-app3
    depends_on:
      - gluster-client
    networks:
      - app-net
    ports:
      - "8082:8080"
    volumes:
      # Same shared volume - automatically synchronized
      - shared-resources:/opt/tomcat/webapps/zenoptics/resources:rw
    environment:
      - CATALINA_OPTS=-Xmx512m -Djava.security.egd=file:/dev/./urandom
      - JAVA_OPTS=-Dspring.profiles.active=production
    restart: unless-stopped

  # Load Balancer (optional)
  nginx:
    image: nginx:alpine
    container_name: tomcat-nginx
    depends_on:
      - tomcat-app1
      - tomcat-app2
      - tomcat-app3
    networks:
      - app-net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  tomcat-cluster-node1-data:
    driver: local
  tomcat-cluster-node2-data:
    driver: local
  tomcat-cluster-node3-data:
    driver: local
  shared-resources:
    driver: local

# Usage:
# 1. Start the cluster: docker-compose -f examples/tomcat-example.yml up -d
# 2. Upload files to any Tomcat instance
# 3. Files will be automatically replicated to all nodes
# 4. Access via:
#    - http://localhost:8080 (Tomcat 1)
#    - http://localhost:8081 (Tomcat 2)
#    - http://localhost:8082 (Tomcat 3)
#    - http://localhost (Load balanced)
# 5. Test by creating files: 
#    docker exec tomcat-app1 touch /opt/tomcat/webapps/zenoptics/resources/test1.txt
#    docker exec tomcat-app2 ls /opt/tomcat/webapps/zenoptics/resources/
#    # You should see test1.txt on all instances